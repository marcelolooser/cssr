[project]
name = "cssr"
version = "0.0.1"
description = "Compressive Sensing-based Super-Resolution Framework"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "Marcelo Looser", email = "marcelo.looser@outlook.com"}
]
keywords = ["compressed-sensing", "sparse-recovery", "super-resolution", "signal-processing", "STM"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.3.0",
    "cvxpy>=1.1.0"
]

[project.urls]
"Homepage" = "https://github.com/marcelolooser/cssr"
"Issues" = "https://github.com/marcelolooser/cssr/issues"